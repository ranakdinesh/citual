

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-spur}
      POSTGRES_USER:     ${POSTGRES_USER:-spur}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spur}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-citual}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-citual-dev-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-citual}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-citual-dev-secret}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-citual-dev}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 2; done &&
      mc mb --ignore-existing local/$$STORAGE_BUCKET &&
      mc anonymous set none local/$$STORAGE_BUCKET
      "

  backend:
    build:
      context: ../..
      dockerfile: citual/Dockerfile.backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-spur}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-spur}?sslmode=disable
      REDIS_URL: redis://redis:6379
      REDIS_ENABLED: "true"
      MESSAGING_EMAIL_PROVIDER: dev_email
      MESSAGING_DEV_EMAIL_OUTBOX: /app/data/dev-email-outbox
      STORAGE_PROVIDER: s3
      STORAGE_BUCKET: ${STORAGE_BUCKET:-citual-dev}
      STORAGE_S3_ENDPOINT: http://minio:9000
      STORAGE_S3_REGION: us-east-1
      STORAGE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-citual}
      STORAGE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-citual-dev-secret}
      STORAGE_S3_USE_PATH_STYLE: "true"
      ENGAGE_TURNSTILE_SECRET: ${ENGAGE_TURNSTILE_SECRET:-}
    ports:
      - "9090:8080"

    volumes:
      - ../keys:/app/keys:ro
      - ./data:/app/data
    labels:
      app: spur
      module: backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
        tag: "{{.Name}}"



  temporal:
    image: temporalio/auto-setup:1.22
    profiles: ["temporal"]
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-spur}
      POSTGRES_PWD:  ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_SEEDS: postgres
    ports:
      - "7233:7233"
    depends_on:
      postgres:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:2.21
    profiles: ["temporal"]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8081:8080"
    depends_on:
      - temporal

  loki:
    image: grafana/loki:2.9.0
    restart: unless-stopped
    volumes:
      - ./loki/config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
   image: grafana/promtail:2.9.0
   restart: unless-stopped
   volumes:
     - /var/run/docker.sock:/var/run/docker.sock:ro
     - /var/lib/docker/containers:/var/lib/docker/containers:ro
     - ./promtail/config.yaml:/etc/promtail/config.yml:ro

  prometheus:
    image: prom/prometheus:v2.47.0
    restart: unless-stopped
    ports:
      - "9092:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:10.2.0
    restart: unless-stopped
    ports:
      - "${GRAFANA_HOST_PORT:-3002}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    depends_on:
      - loki
      - prometheus

  citual-web:
    build:
      context: ../../citual-web
      dockerfile: Dockerfile
      args:
        INTERNAL_BACKEND_URL: http://backend:8080
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${ENGAGE_TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://backend:8080/api/v1
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${ENGAGE_TURNSTILE_SITE_KEY:-}
      INTERNAL_BACKEND_URL: http://backend:8080
      CITUAL_CONTACT_LEAD_FORM_KEY: ${CITUAL_CONTACT_LEAD_FORM_KEY:-}
    ports:
      - "8085:8085"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8085/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pg_data:
  redis_data:
  loki_data:
  prometheus_data:
  grafana_data:
  minio_data:
