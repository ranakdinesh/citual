name: Deploy Dev

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: citual-dev-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to development server
    runs-on: self-hosted
    timeout-minutes: 45
    env:
      CITUAL_DEV_WORKSPACE: /opt/citual-dev
      DEV_DEPLOY_BRANCH: main
      DEV_DEPLOY_PULL_REPOS: citual citual-web spur-identity spur-engage spur-messaging spur-storage spur-template
    steps:
      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CITUAL_DEV_WORKSPACE"
          if [ ! -d "$CITUAL_DEV_WORKSPACE/citual/.git" ]; then
            backup_dir=""
            if [ -e "$CITUAL_DEV_WORKSPACE/citual" ]; then
              backup_dir="$CITUAL_DEV_WORKSPACE/.deploy/bootstrap-backups/citual-$(date -u +%Y%m%dT%H%M%SZ)"
              mkdir -p "$(dirname "$backup_dir")"
              mv "$CITUAL_DEV_WORKSPACE/citual" "$backup_dir"
            fi
            git clone https://github.com/ranakdinesh/citual.git "$CITUAL_DEV_WORKSPACE/citual"
            if [ -n "$backup_dir" ] && [ -f "$backup_dir/deployments/.env" ]; then
              cp "$backup_dir/deployments/.env" "$CITUAL_DEV_WORKSPACE/citual/deployments/.env"
              chmod 600 "$CITUAL_DEV_WORKSPACE/citual/deployments/.env" || true
            fi
            if [ -n "$backup_dir" ] && [ -d "$backup_dir/keys" ]; then
              cp -a "$backup_dir/keys" "$CITUAL_DEV_WORKSPACE/citual/keys"
            fi
          fi
          cd "$CITUAL_DEV_WORKSPACE/citual"
          git fetch origin main --tags
          git checkout main
          git reset --hard origin/main
          chmod +x deployments/scripts/*.sh

      - name: Update module workspace
        shell: bash
        run: |
          set -euo pipefail
          cd "$CITUAL_DEV_WORKSPACE/citual"
          deployments/scripts/update-workspace.sh

      - name: Deploy Docker stack
        shell: bash
        run: |
          set -euo pipefail
          cd "$CITUAL_DEV_WORKSPACE/citual"
          deployments/scripts/deploy-dev.sh
