<!DOCTYPE html>

<div class="max-w-[1280px] mx-auto px-4 sm:px-6 lg:px-8">

<div class="flex items-center gap-3">

</div>
<span class="text-lg font-bold tracking-tight text-slate-900 dark:text-white">SaaS Platform</span>
</div>
<div>
<span class="text-sm text-slate-500 dark:text-slate-400 mr-2 hidden sm:inline">Already have an account?</span>
<button class="bg-transparent hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-900 dark:text-white font-medium py-2 px-4 rounded-lg text-sm transition-colors border border-slate-200 dark:border-slate-700">
                        Log In
                    </button>
</div>
</div>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex items-center justify-center p-4 sm:p-6 lg:p-8 relative">
<!-- Abstract Background Decoration -->
<div class="absolute inset-0 overflow-hidden pointer-events-none -z-10">
<div class="absolute top-0 left-1/4 w-[500px] h-[500px] bg-primary/20 rounded-full blur-[100px] opacity-20 dark:opacity-10 translate-y-[-50%]"></div>
<div class="absolute bottom-0 right-1/4 w-[600px] h-[600px] bg-primary/30 rounded-full blur-[120px] opacity-20 dark:opacity-10 translate-y-[50%]"></div>
</div>
<!-- Registration Card -->
<div class="w-full max-w-[640px] bg-white dark:bg-[#192233] rounded-xl shadow-xl dark:shadow-none border border-slate-200 dark:border-slate-800 overflow-hidden">
<!-- Card Header -->
<div class="px-8 pt-10 pb-6">
<div class="flex flex-col gap-2 text-center sm:text-left">
<h1 class="text-3xl sm:text-4xl font-black tracking-[-0.033em] text-slate-900 dark:text-white">Create your account</h1>
<p class="text-slate-500 dark:text-[#92a4c9] text-base font-normal">Start your 14-day free trial today. Join thousands of users managing their workflow efficiently.</p>
</div>
</div>
<!-- Form Content -->
<div class="px-8 pb-10">
<form class="flex flex-col gap-5">
<!-- Row 1: Name Fields -->
<div class="flex flex-col sm:flex-row gap-4">
<label class="flex flex-col flex-1">
<span class="text-slate-900 dark:text-white text-sm font-medium pb-2">First Name</span>
<input class="form-input w-full rounded-lg border-slate-300 dark:border-[#324467] bg-slate-50 dark:bg-[#111722] text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-[#92a4c9] focus:border-primary focus:ring-primary h-12 px-4 text-base transition-colors" placeholder="Enter first name" type="text"/>
</label>
<label class="flex flex-col flex-1">
<span class="text-slate-900 dark:text-white text-sm font-medium pb-2">Last Name</span>
<input class="form-input w-full rounded-lg border-slate-300 dark:border-[#324467] bg-slate-50 dark:bg-[#111722] text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-[#92a4c9] focus:border-primary focus:ring-primary h-12 px-4 text-base transition-colors" placeholder="Enter last name" type="text"/>
</label>
</div>
<!-- Row 2: Email -->
<label class="flex flex-col w-full">
<span class="text-slate-900 dark:text-white text-sm font-medium pb-2">Email Address</span>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
<span class="material-symbols-outlined text-[20px]">mail</span>
</span>
<input class="form-input w-full rounded-lg border-slate-300 dark:border-[#324467] bg-slate-50 dark:bg-[#111722] text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-[#92a4c9] focus:border-primary focus:ring-primary h-12 pl-10 pr-4 text-base transition-colors" placeholder="name@company.com" type="email"/>
</div>
</label>
<!-- Row 3: Mobile -->
<label class="flex flex-col w-full">
<span class="text-slate-900 dark:text-white text-sm font-medium pb-2">Mobile Number</span>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
<span class="material-symbols-outlined text-[20px]">call</span>
</span>
<input class="form-input w-full rounded-lg border-slate-300 dark:border-[#324467] bg-slate-50 dark:bg-[#111722] text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-[#92a4c9] focus:border-primary focus:ring-primary h-12 pl-10 pr-4 text-base transition-colors" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
</label>
<!-- Row 4: Password -->
<label class="flex flex-col w-full">
<span class="text-slate-900 dark:text-white text-sm font-medium pb-2">Password</span>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
<span class="material-symbols-outlined text-[20px]">lock</span>
</span>
<input class="form-input w-full rounded-lg border-slate-300 dark:border-[#324467] bg-slate-50 dark:bg-[#111722] text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-[#92a4c9] focus:border-primary focus:ring-primary h-12 pl-10 pr-10 text-base transition-colors" placeholder="Create a password" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
<!-- Strength Meter -->
<div class="w-full h-1 bg-slate-200 dark:bg-slate-700 mt-2 rounded-full overflow-hidden">
<div class="h-full w-1/4 bg-red-500"></div>
</div>
<p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Weak password. Try adding numbers and symbols.</p>
</label>
<!-- Row 5: Confirm Password -->
<label class="flex flex-col w-full">
<span class="text-slate-900 dark:text-white text-sm font-medium pb-2">Confirm Password</span>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
<span class="material-symbols-outlined text-[20px]">lock_reset</span>
</span>
<input class="form-input w-full rounded-lg border-slate-300 dark:border-[#324467] bg-slate-50 dark:bg-[#111722] text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-[#92a4c9] focus:border-primary focus:ring-primary h-12 pl-10 pr-4 text-base transition-colors" placeholder="Confirm your password" type="password"/>
</div>
</label>
<!-- Checkbox & Terms -->
<div class="flex items-start gap-3 mt-2">
<div class="flex h-6 items-center">
<input class="h-4 w-4 rounded border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-[#111722] text-primary focus:ring-primary" id="terms" name="terms" type="checkbox"/>
</div>
<div class="text-sm leading-6">
<label class="font-medium text-slate-700 dark:text-slate-300" for="terms">
                                I agree to the <a class="text-primary hover:underline" href="#">Terms of Service</a> and <a class="text-primary hover:underline" href="#">Privacy Policy</a>
</label>
</div>
</div>
<!-- Submit Button -->
<button class="mt-4 flex w-full items-center justify-center rounded-lg bg-primary py-3 px-4 text-sm font-bold text-white shadow-sm hover:bg-blue-600 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary transition-colors" type="button">
                        Create Account
                    </button>
</form>
</div>
<!-- Card Footer -->
<div class="bg-slate-50 dark:bg-[#141b2d] px-8 py-4 text-center border-t border-slate-200 dark:border-slate-800">
<p class="text-sm text-slate-500 dark:text-slate-400">
                    Already have an account? 
                    <a class="font-semibold text-primary hover:text-blue-500" href="#">Log in</a>
</p>
</div>
</div>
</main>
<!-- Simple Footer Copyright -->
<footer class="w-full py-6 text-center text-sm text-slate-500 dark:text-slate-600">
        © 2024 SaaS Platform Inc. All rights reserved.
    </footer>
</body></html>
